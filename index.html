<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Репетитор</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #34d399;
      --danger: #f87171;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      min-height: 100vh;
    }
    header {
      padding: 16px 0;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
    }
    .tabs {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--accent);
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 14px;
    }
    button.btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .list-item {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .student-name {
      font-size: 17px;
      font-weight: 600;
    }
    .balance-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .positive { background: rgba(52, 211, 153, 0.2); color: var(--success); }
    .negative { background: rgba(248, 113, 113, 0.2); color: var(--danger); }
    .neutral { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-small {
      flex: 1;
      padding: 8px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-history {
      background: #334155;
      color: var(--text);
    }
    .btn-delete {
      background: rgba(248, 113, 113, 0.15);
      color: var(--danger);
      flex: 0 0 40px;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      max-width: 500px;
      margin: 40px auto 0;
      border: 1px solid var(--border);
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .history-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Репетитор</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('students')">Ученики</button>
    <button class="tab-btn" onclick="switchTab('lessons')">Занятия</button>
  </div>

  <!-- ВКЛАДКА УЧЕНИКОВ -->
  <section id="tab-students">
    <div class="card">
      <div class="card-title">Добавить ученика</div>
      <label>Имя ученика</label>
      <input type="text" id="student-name" placeholder="Например, Ахмед">
      
      <label>Стоимость одного урока (₽)</label>
      <input type="number" id="student-rate" placeholder="1000">

      <button class="btn-primary" onclick="addStudent()">Сохранить ученика</button>
    </div>

    <div class="card-title" style="margin-top: 20px;">Список учеников</div>
    <div id="students-list"></div>
  </section>

  <!-- ВКЛАДКА ЗАНЯТИЙ -->
  <section id="tab-lessons" style="display: none;">
    <div class="card">
      <div class="card-title">Провести урок</div>
      <label>Выберите ученика</label>
      <select id="lesson-student"></select>

      <label>Дата занятия</label>
      <input type="date" id="lesson-date">

      <button class="btn-primary" onclick="conductLesson()">Списать за занятие</button>
    </div>
  </section>

  <!-- МОДАЛЬНОЕ ОКНО ИСТОРИИ ОПЛАТ -->
  <div class="modal" id="student-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 id="modal-student-name" style="font-size: 20px;"></h2>
        <button onclick="closeModal()" style="background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer;">✕</button>
      </div>

      <div style="margin-bottom: 16px;">
        <span style="color: var(--text-muted); font-size: 14px;">Текущий баланс: </span>
        <strong id="modal-balance" style="font-size: 18px;"></strong>
      </div>

      <div class="card" style="background: #0f172a; padding: 12px; margin-bottom: 16px;">
        <label>Внести оплату (₽)</label>
        <input type="number" id="payment-amount" placeholder="Сумма, например 5000">
        
        <label>Дата оплаты</label>
        <input type="date" id="payment-date">

        <button class="btn-primary" onclick="addPayment()">Зачислить оплату</button>
      </div>

      <div class="card-title" style="font-size: 16px;">История по датам</div>
      <div id="modal-history" style="max-height: 250px; overflow-y: auto;"></div>
    </div>
  </div>

  <script>
    let students = JSON.parse(localStorage.getItem('rep_students')) || [];
    let currentStudentId = null;

    function save() {
      localStorage.setItem('rep_students', JSON.stringify(students));
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'students') {
        document.querySelector('.tabs button:first-child').classList.add('active');
        document.getElementById('tab-students').style.display = 'block';
        document.getElementById('tab-lessons').style.display = 'none';
      } else {
        document.querySelector('.tabs button:last-child').classList.add('active');
        document.getElementById('tab-students').style.display = 'none';
        document.getElementById('tab-lessons').style.display = 'block';
        updateLessonSelect();
      }
    }

    function addStudent() {
      const name = document.getElementById('student-name').value.trim();
      const rate = parseFloat(document.getElementById('student-rate').value);

      if (!name || isNaN(rate)) {
        alert('Пожалуйста, заполните имя и стоимость урока');
        return;
      }

      students.push({
        id: Date.now(),
        name,
        rate,
        balance: 0,
        history: [] // { date, amount, type: 'payment' | 'lesson' }
      });

      save();
      renderStudents();
      document.getElementById('student-name').value = '';
      document.getElementById('student-rate').value = '';
    }

    function renderStudents() {
      const list = document.getElementById('students-list');
      list.innerHTML = '';

      if (students.length === 0) {
        list.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">Нет учеников</div>';
        return;
      }

      students.forEach(st => {
        let badgeClass = 'neutral';
        if (st.balance > 0) badgeClass = 'positive';
        else if (st.balance < 0) badgeClass = 'negative';

        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div class="item-header">
            <span class="student-name">${st.name}</span>
            <span class="balance-badge ${badgeClass}">${st.balance} ₽</span>
          </div>
          <div style="font-size: 13px; color: var(--text-muted);">
            Ставка: ${st.rate} ₽ / занятие
          </div>
          <div class="btn-row">
            <button class="btn-small btn-history" onclick="openStudentModal(${st.id})">История и оплаты</button>
            <button class="btn-small btn-delete" onclick="deleteStudent(${st.id})">✕</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function openStudentModal(id) {
      currentStudentId = id;
      const st = students.find(s => s.id === id);
      if (!st) return;

      document.getElementById('modal-student-name').textContent = st.name;
      document.getElementById('modal-balance').textContent = `${st.balance} ₽`;
      document.getElementById('modal-balance').style.color = st.balance >= 0 ? 'var(--success)' : 'var(--danger)';
      document.getElementById('payment-date').valueAsDate = new Date();
      document.getElementById('payment-amount').value = '';

      renderHistory(st);
      document.getElementById('student-modal').style.display = 'block';
    }

    function renderHistory(st) {
      const histDiv = document.getElementById('modal-history');
      histDiv.innerHTML = '';

      if (!st.history || st.history.length === 0) {
        histDiv.innerHTML = '<div style="color: var(--text-muted); font-size: 13px; padding: 8px 0;">Истории оплат пока нет</div>';
        return;
      }

      st.history.slice().reverse().forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';
        const isPay = item.type === 'payment';
        row.innerHTML = `
          <div>
            <div style="font-weight: 500;">${isPay ? 'Оплата' : 'Урок'}</div>
            <div style="font-size: 12px; color: var(--text-muted);">${item.date}</div>
          </div>
          <div style="font-weight: 600; color: ${isPay ? 'var(--success)' : 'var(--danger)'};">
            ${isPay ? '+' : '-'}${Math.abs(item.amount)} ₽
          </div>
        `;
        histDiv.appendChild(row);
      });
    }

    function addPayment() {
      const amount = parseFloat(document.getElementById('payment-amount').value);
      const date = document.getElementById('payment-date').value;

      if (isNaN(amount) || amount <= 0 || !date) {
        alert('Введите корректную сумму и дату');
        return;
      }

      const st = students.find(s => s.id === currentStudentId);
      if (!st) return;

      st.balance += amount;
      st.history.push({
        date,
        amount,
        type: 'payment'
      });

      save();
      renderStudents();
      openStudentModal(currentStudentId);
    }

    function conductLesson() {
      const select = document.getElementById('lesson-student');
      const id = parseInt(select.value);
      const date = document.getElementById('lesson-date').value;

      if (!id || !date) {
        alert('Выберите ученика и дату');
        return;
      }

      const st = students.find(s => s.id === id);
      if (!st) return;

      st.balance -= st.rate;
      st.history.push({
        date,
        amount: st.rate,
        type: 'lesson'
      });

      save();
      renderStudents();
      alert(`Урок проведён! Списано ${st.rate} ₽`);
    }

    function deleteStudent(id) {
      if (confirm('Удалить ученика со всей историей?')) {
        students = students.filter(s => s.id !== id);
        save();
        renderStudents();
      }
    }

    function updateLessonSelect() {
      const select = document.getElementById('lesson-student');
      select.innerHTML = '<option value="">Выберите ученика...</option>';
      students.forEach(st => {
        select.innerHTML += `<option value="${st.id}">${st.name} (${st.rate} ₽)</option>`;
      });
      document.getElementById('lesson-date').valueAsDate = new Date();
    }

    function closeModal() {
      document.getElementById('student-modal').style.display = 'none';
      currentStudentId = null;
    }

    // Инициализация при старте
    renderStudents();
  </script>
</body>
</html>
