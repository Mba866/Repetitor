<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Репетитор</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Репетитор">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%230f172a'/%3E%3Crect x='116' y='60' width='280' height='130' rx='14' fill='%231e293b' stroke='%2338bdf8' stroke-width='10'/%3E%3Ccircle cx='180' cy='240' r='42' fill='%2338bdf8'/%3E%3Cpath d='M120 370c0-45 35-70 60-70s60 25 60 70' fill='%2338bdf8'/%3E%3Ccircle cx='332' cy='255' r='36' fill='%2334d399'/%3E%3Cpath d='M280 370c0-38 30-60 52-60s52 22 52 60' fill='%2334d399'/%3E%3Crect x='90' y='360' width='332' height='24' rx='12' fill='%23475569'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #34d399;
      --danger: #f87171;
      --border: #334155;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: calc(env(safe-area-inset-top, 20px) + 12px) 16px calc(env(safe-area-inset-bottom, 20px) + 16px);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header { padding-bottom: 16px; text-align: center; }
    h1 { font-size: 24px; font-weight: 700; }
    .tabs {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #0f172a; }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      width: 100%;
    }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: var(--accent); }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 14px;
      display: block;
      appearance: none;
      -webkit-appearance: none;
    }
    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      padding-right: 36px;
    }
    button.btn-primary {
      width: 100%;
      height: 46px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .list-item {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .student-name { font-size: 17px; font-weight: 600; }
    .balance-badge { padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .positive { background: rgba(52, 211, 153, 0.2); color: var(--success); }
    .negative { background: rgba(248, 113, 113, 0.2); color: var(--danger); }
    .neutral { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-small { flex: 1; height: 38px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-history { background: #334155; color: var(--text); }
    .btn-delete { background: rgba(248, 113, 113, 0.15); color: var(--danger); flex: 0 0 44px; }
    .btn-execute { background: rgba(52, 211, 153, 0.2); color: var(--success); }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      padding: 20px 16px;
      overflow-y: auto;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      max-width: 500px;
      margin: 30px auto 0;
      border: 1px solid var(--border);
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .history-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <header><h1>Репетитор</h1></header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('students')">Ученики</button>
    <button class="tab-btn" onclick="switchTab('schedule')">Расписание</button>
  </div>

  <section id="tab-students">
    <div class="card">
      <div class="card-title">Добавить ученика</div>
      <label>Имя ученика</label>
      <input type="text" id="student-name" placeholder="Например, Ахмед">
      <label>Стоимость одного урока (₽)</label>
      <input type="number" id="student-rate" placeholder="1000">
      <button class="btn-primary" onclick="addStudent()">Сохранить ученика</button>
    </div>
    <div class="card-title" style="margin-top: 10px;">Список учеников</div>
    <div id="students-list"></div>
  </section>

  <section id="tab-schedule" style="display: none;">
    <div class="card">
      <div class="card-title">Запланировать урок</div>
      <label>Выберите ученика</label>
      <select id="plan-student"></select>
      <label>Дата и время занятия</label>
      <input type="datetime-local" id="plan-datetime">
      <button class="btn-primary" onclick="planLesson()">Добавить в график</button>
    </div>
    <div class="card-title" style="margin-top: 10px;">Предстоящие занятия</div>
    <div id="schedule-list"></div>
  </section>

  <div class="modal" id="student-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h2 id="modal-student-name" style="font-size: 20px;"></h2>
        <button onclick="closeModal()" style="background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; padding: 4px;">✕</button>
      </div>
      <div style="margin-bottom: 16px;">
        <span style="color: var(--text-muted); font-size: 14px;">Текущий баланс: </span>
        <strong id="modal-balance" style="font-size: 18px;"></strong>
      </div>
      <div class="card" style="background: #0f172a; padding: 12px; margin-bottom: 16px;">
        <label>Внести оплату (₽)</label>
        <input type="number" id="payment-amount" placeholder="Сумма, например 5000">
        <label>Дата и время оплаты</label>
        <input type="datetime-local" id="payment-datetime">
        <button class="btn-primary" onclick="addPayment()">Зачислить оплату</button>
      </div>
      <div class="card-title" style="font-size: 16px;">История по датам и времени</div>
      <div id="modal-history" style="max-height: 250px; overflow-y: auto;"></div>
    </div>
  </div>
